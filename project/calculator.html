<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Interactive calculator to estimate monthly utility costs in Naira for electricity, water, and fuel.">
  <meta name="author" content="Honest O. Christopher">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Utility Cost Calculator — Calculator</title>
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/script.js"></script>
</head>
<body>

<header>
  <h1>Utility Cost Calculator</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="calculator.html">Calculator</a>
    <a href="tips.html">Tips</a>
  </nav>
  <button id="darkModeToggle">🌙 Dark Mode</button>
</header>

<main>
  <section>
    <h2>Enter Monthly Usage</h2>
    <form id="utilityForm">
      <label for="electricity">Electricity (kWh per month):</label>
      <input type="number" id="electricity" name="electricity" min="0" required>

      <label for="water">Water (cubic meters per month):</label>
      <input type="number" id="water" name="water" min="0" required>

      <label for="fuel">Generator Fuel (liters per month):</label>
      <input type="number" id="fuel" name="fuel" min="0" required>

      <button type="submit">Calculate</button>
      <button type="button" id="clearHistory">Clear History</button>
    </form>

    <div id="results" aria-live="polite"></div>
    <div id="previous"></div>
  </section>
</main>

<footer>
  <p>&copy; <span id="year"></span> Honest O. Christopher — Community Utility Cost Calculator</p>
  <a href="references.html">References</a>
</footer>

</body>
</html>
